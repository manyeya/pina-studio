[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"

# Dependencies optimized even in dev builds: unoptimized gpui and DSP can't keep up with the
# screen or the audio callback.
# Dependencies fast and without debug info, Pina Studio's own code with line numbers (enough for a
# backtrace): with full debug info everywhere target/debug grew to 37 GB.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"
