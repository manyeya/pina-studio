[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
authors = ["Manyeya Khutso Siema"]
# The source; release builds are GPL-3.0-or-later as a whole (they include Rubber Band): NOTICE.
license = "MIT"
description = "A DAW where AI agents work in your song with you"
homepage = "https://manyeya.github.io/pina-studio/"
repository = "https://github.com/manyeya/pina-studio"

# Dependencies optimized even in dev builds: unoptimized gpui and DSP can't keep up with the
# screen or the audio callback.
# Dependencies fast and without debug info, Pina Studio's own code with line numbers (enough for a
# backtrace): with full debug info everywhere target/debug grew to 37 GB.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# What ships: the audio thread has no time to spare, so code is optimized across its crates.
[profile.release]
lto = "thin"
codegen-units = 1
