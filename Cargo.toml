[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Dependencies optimized even in dev builds: unoptimized gpui and DSP can't keep up with the
# screen or the audio callback.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
