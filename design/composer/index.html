<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compose designs</title>
<style>
@font-face{font-family:Geist;src:url(../../crates/app/assets/fonts/Geist-Regular.ttf);font-weight:400}
@font-face{font-family:Geist;src:url(../../crates/app/assets/fonts/Geist-Medium.ttf);font-weight:500}
@font-face{font-family:Geist;src:url(../../crates/app/assets/fonts/Geist-SemiBold.ttf);font-weight:600}
@font-face{font-family:Geist;src:url(../../crates/app/assets/fonts/Geist-Bold.ttf);font-weight:700}
@font-face{font-family:"Geist Mono";src:url(../../crates/app/assets/fonts/GeistMono-Regular.ttf);font-weight:400}
@font-face{font-family:"Geist Mono";src:url(../../crates/app/assets/fonts/GeistMono-Medium.ttf);font-weight:500}
@font-face{font-family:"Geist Mono";src:url(../../crates/app/assets/fonts/GeistMono-SemiBold.ttf);font-weight:600}
:root{
  --bg:#0c0c0f;--surface:#131317;--card:#1a1a1f;--strip:#18181d;--well:#0f0f13;--field:#24242b;--raised:#2b2b33;
  --off:#1e1e25;--lane:#0e0e12;--lane-alt:#121217;--headers:#101014;--header-sel:#1b1b21;
  --line:#26262d;--soft:#1c1c22;--strong:#34343d;
  --t1:#f4f4f6;--t2:#d4d4da;--t3:#8a8a95;--t4:#55555f;
  --accent:#5b8cff;--accent-t:#a5c0ff;--record:#ff4d4d;--amber:#ffc53d;--mint:#3ddc97;
  --coral:#ff7a59;--violet:#a78bfa;--sky:#38bdf8;--teal:#2dd4bf;--indigo:#818cf8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#060608;color:var(--t1);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:"Geist Mono",ui-monospace,monospace}

/* The review bar: outside the app, so it's plain. */
.review{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 20px;background:#060608;border-bottom:1px solid #1a1a20}
.review h1{font-size:14px;font-weight:600;margin-right:4px}
.review .grp{display:flex;align-items:center;gap:8px}
.review .cap{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.review .opts{display:flex;background:#111115;border:1px solid #23232a;border-radius:8px;padding:2px}
.review .opts button{padding:5px 11px;border-radius:6px;font-size:12.5px;color:var(--t3)}
.review .opts button.on{background:#26262e;color:var(--t1)}
.stage{padding:18px 20px 8px}
.frame{position:relative;transform-origin:top left}
.about{max-width:1100px;padding:6px 20px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;font-size:13px;line-height:1.55;color:var(--t2)}
.about h3{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:4px}
.about p{color:var(--t3)}

/* The app window. */
.win{width:1440px;height:900px;background:var(--bg);border:1px solid #23232a;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;font-size:13px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.win.narrow{width:1000px;height:800px}
.cbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.cbar .appicon{width:26px;height:26px;border-radius:7px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:4px;background:#1d1d24}
.cbar .appicon i{display:block;background:var(--coral);border-radius:1.5px;opacity:.85}
.cbar .song{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill{display:flex;align-items:center;gap:2px;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:3px;height:38px}
.ib{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--t2)}
.ib.on{background:var(--raised);color:var(--t1)}
.ib svg{width:16px;height:16px}
.ro{display:flex;flex-direction:column;justify-content:center;padding:0 9px;line-height:1.05}
.ro b{font-family:"Geist Mono";font-weight:500;font-size:16px}
.ro span{font-family:"Geist Mono";font-size:8.5px;color:var(--t3);letter-spacing:.06em;margin-top:3px}
.seg{display:flex;background:var(--well);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;color:var(--t3);font-weight:500;font-size:12.5px;white-space:nowrap}
.seg button.on{background:var(--raised);color:var(--t1)}
.seg.mono button{font-family:"Geist Mono";font-size:12px}
.export{background:var(--t1);color:var(--bg);font-weight:600;padding:8px 14px;border-radius:9px;font-size:13px}
.grow{flex:1;min-width:0}
.status{height:24px;flex:none;display:flex;align-items:center;gap:18px;padding:0 12px;border-top:1px solid var(--line);background:var(--surface);color:var(--t3);font-size:11.5px;white-space:nowrap;overflow:hidden}
.status .grow{overflow:hidden;text-overflow:ellipsis}
.status .busy{color:var(--t2);display:flex;align-items:center;gap:7px}

/* Panels and controls. */
.body{flex:1;display:flex;min-height:0}
.insp{width:248px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:14px 14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.insp h2{font-size:14px;font-weight:600}
.sect{font-size:12px;color:var(--t3);font-weight:500;display:flex;justify-content:space-between}
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.knob{background:var(--card);border-radius:9px;padding:7px;display:flex;gap:7px;align-items:center}
.knob div{line-height:1.2}
.knob small{display:block;font-size:11px;color:var(--t3)}
.knob b{font-family:"Geist Mono";font-weight:500;font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.cap2{font-size:11px;color:var(--t3);font-weight:500}
.lbl{font-size:12px;color:var(--t3)}
.field{background:var(--field);border:1px solid transparent;border-radius:7px;height:28px;display:flex;align-items:center;gap:6px;padding:0 9px;font-size:12.5px;white-space:nowrap;min-width:0}
.field .v{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.field svg{width:13px;height:13px;color:var(--t3);flex:none}
.field.nf{font-family:"Geist Mono";justify-content:center;width:46px;padding:0}
.field.dis{opacity:.45}
.btn{height:28px;border-radius:7px;padding:0 11px;background:var(--raised);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn svg{width:13px;height:13px}
.btn.primary{background:var(--t1);color:var(--bg);font-weight:600}
.btn.primary.dis{background:var(--raised);color:var(--t4)}
.btn.big{height:34px;width:100%;justify-content:center;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.ctl{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:8px;min-height:30px}
.ctl .lbl{white-space:nowrap}
.slider{position:relative;height:18px;display:flex;align-items:center;gap:8px}
.slider .track{position:relative;flex:1;height:4px;border-radius:2px;background:var(--raised)}
.slider .fill{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--t2)}
.slider .h{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:6px;background:var(--t1);box-shadow:0 0 0 3px var(--bg)}
.slider .rd{font-family:"Geist Mono";font-size:11.5px;color:var(--t2);min-width:38px;text-align:right}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--t4);padding:0 0 0 94px;margin-top:-6px}
.toggle{width:28px;height:16px;border-radius:8px;background:var(--raised);position:relative;flex:none}
.toggle::after{content:"";position:absolute;width:12px;height:12px;border-radius:6px;top:2px;left:2px;background:var(--t3)}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:14px;background:#fff}
.hr{height:1px;background:var(--soft);flex:none}
.lic{font-size:10.5px;font-weight:500;color:var(--amber);background:var(--well);border-radius:5px;padding:1px 6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:4px;flex:none}
.prog{height:4px;border-radius:2px;background:var(--raised);overflow:hidden;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.shim{position:relative;overflow:hidden}
.shim::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:sh 1.6s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}

/* Tracks: headers and lanes. */
.tracks{display:flex;min-height:0;flex:1}
.heads{flex:none;background:var(--headers);border-right:1px solid var(--line);display:flex;flex-direction:column}
.tools{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--soft);position:relative;flex:none}
.head.sel{background:var(--header-sel)}
.head .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.head .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.head .ic svg{width:16px;height:16px}
.head .nm{line-height:1.25;min-width:0;flex:1}
.head .nm b{font-weight:600;font-size:13.5px;white-space:nowrap}
.head .nm b em{font-style:normal;font-family:"Geist Mono";font-size:11px;color:var(--t3);font-weight:400;margin-right:6px}
.head .nm small{display:block;color:var(--t3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{display:flex;gap:4px}
.ms i{width:22px;height:20px;border-radius:5px;background:var(--off);font-style:normal;font-size:10.5px;color:var(--t3);display:grid;place-items:center;font-weight:600}
.ms i.w{background:rgba(91,140,255,.18);color:var(--accent-t)}
.vol{font-family:"Geist Mono";font-size:11.5px;color:var(--t2);background:var(--well);border-radius:5px;padding:2px 6px}
.lanes{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;background:var(--lane)}
.ruler{height:48px;flex:none;border-bottom:1px solid var(--line);position:relative;background:var(--surface)}
svg{display:block}

/* Editor. */
.editor{flex:none;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface)}
.ebar{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--line)}
.ebar .tname{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.ebar .cnt{font-family:"Geist Mono";color:var(--t3);font-size:11.5px;font-weight:400}
.etabs{display:flex;gap:2px;background:var(--well);border:1px solid var(--line);border-radius:9px;padding:2px;overflow:hidden;min-width:0}
.etabs button{padding:4px 10px;border-radius:7px;color:var(--t3);font-size:12.5px;font-weight:500;white-space:nowrap}
.etabs button.on{background:var(--raised);color:var(--t1)}
.chip{height:28px;border-radius:7px;padding:0 10px;display:flex;align-items:center;gap:6px;background:#1c2540;color:var(--accent-t);font-weight:500;font-size:12.5px;white-space:nowrap}
.ebody{flex:1;display:flex;min-height:0}
.epanel{width:300px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;gap:2px;margin:10px 12px 0;background:var(--well);border:1px solid var(--line);border-radius:9px;padding:2px}
.ptabs button{flex:1;padding:4px 0;border-radius:7px;color:var(--t3);font-size:12px;font-weight:500}
.ptabs button.on{background:var(--raised);color:var(--t1)}
.pbody{flex:1;overflow:hidden;padding:12px 12px 12px;display:flex;flex-direction:column;gap:9px;min-height:0}
.pfoot{padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.readout{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.readout .mono{color:var(--t3);font-size:11.5px}

/* Rows (house pattern: dense, neutral, a soft line between). */
.rows>div{border-top:1px solid var(--soft)}
.rows>div:first-child{border-top:0}
.take{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:6px 6px;border-radius:7px;position:relative}
.take.sel{background:var(--header-sel)}
.take.sel::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--accent)}
.take .n{font-family:"Geist Mono";font-size:12px;color:var(--t3);text-align:center}
.take .meta{font-family:"Geist Mono";font-size:11px;color:var(--t3)}
.step{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:7px 0}
.step .s{width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:600;margin-top:1px}
.step b{font-weight:500;font-size:12.5px;display:block}
.step small{color:var(--t3);font-size:11.5px;line-height:1.4;display:block;margin-top:2px}

/* Settings. */
.rail{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.rail .g{font-size:10.5px;letter-spacing:.07em;color:var(--t4);font-weight:600;padding:12px 8px 5px}
.rail .it{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:var(--t2);font-size:13px;white-space:nowrap}
.rail .it svg{width:15px;height:15px;color:var(--t3)}
.rail .it.on{background:var(--raised);color:var(--t1)}
.spage{flex:1;overflow:hidden;padding:22px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.spage h1{font-size:20px;font-weight:600}
.spage .sub{color:var(--t3);font-size:13px;margin-top:4px;max-width:720px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card>.ct{padding:12px 16px 4px;font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.card>.ct small{color:var(--t3);font-weight:400;font-size:12px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--soft);min-width:0}
.card>.ct+.srow{border-top:0}
.srow .tx{flex:1;min-width:0}
.srow .tx b{font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srow .tx small{display:block;color:var(--t3);font-size:12px;margin-top:2px;line-height:1.4}
.num{width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;flex:none}

/* Composer page grid. */
.cgrid{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--lane)}
.rhead{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--soft);flex:none;position:relative}
.rhead .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.eye{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--t3)}
.eye svg{width:14px;height:14px}
.part{font-size:11.5px;color:var(--t2);background:var(--field);border-radius:6px;height:22px;padding:0 6px 0 8px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.part svg{width:11px;height:11px;color:var(--t3)}
.ctab{display:flex;gap:16px;border-bottom:1px solid var(--line);padding:0 12px;height:36px;align-items:flex-end}
.ctab button{padding:0 0 9px;color:var(--t3);font-weight:500;font-size:12.5px;border-bottom:2px solid transparent;white-space:nowrap}
.ctab button.on{color:var(--t1);border-color:var(--t1)}
</style>
</head>
<body>
<div class="review">
  <h1>Compose · three designs</h1>
  <div class="grp"><span class="cap">Design</span><div class="opts" id="o-design"></div></div>
  <div class="grp"><span class="cap">State</span><div class="opts" id="o-state"></div></div>
  <div class="grp"><span class="cap">Window</span><div class="opts" id="o-width"></div></div>
</div>
<div class="stage"><div class="frame" id="frame"></div></div>
<div class="about" id="about"></div>

<script>
// ---------- Icons: Lucide's paths, the set the app draws with. ----------
const P = {
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
  square:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
  start:'<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/>',
  rec:'<circle cx="12" cy="12" r="6" fill="currentColor"/>',

  metro:'<path d="M12 11.4V9.1"/><path d="m12 17 6.59-6.59"/><path d="m15.05 5.7-.218-.691a3 3 0 0 0-5.663 0L4.418 19.695A1 1 0 0 0 5.37 21h13.253a1 1 0 0 0 .951-1.31L18.45 16.2"/><circle cx="20" cy="9" r="2"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  panel:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
  editor:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 15h18"/>',
  mixer:'<line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/>',
  grid:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  study:'<path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/>',
  sliders:'<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
  compose:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  pointer:'<path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/>',
  pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>',
  eraser:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>',

  if (state === 'first') takes = `<div style="flex:1;display:grid;place-items:center;color:var(--t3);text-align:center;font-size:12.5px;line-height:1.6;padding:0 16px">${narrow ? `<div style="width:100%;text-align:left">${setup(true)}</div>` : 'Takes come in here, each to hear in the song before you keep it'}</div>`;
  else if (state === 'ready') takes = `<div style="flex:1;display:grid;place-items:center;color:var(--t3);text-align:center;font-size:12.5px;line-height:1.6">Each take writes Bass and Pad together,<br>hearing Drums, 808 and Stabs around them</div>`;
  else {
    const lw = Math.max(160, W3 - 230);
    takes = `<div class="rows" style="flex:1;overflow:hidden">${TAKES.map((t, i) => {
      const live = state === 'writing' && i === 1, wait = state === 'writing' && i > 1;
      const bassN = live ? t.bass.filter(n => n.s < 31.6) : wait ? [] : t.bass, padN = live ? t.pad.filter(n => n.s < 31.6) : wait ? [] : t.pad;
      const on = state === 'takes' && i === 1;
      return `<div class="take${on ? ' sel' : ''}" style="grid-template-columns:22px 1fr 96px;padding:6px 8px;margin:0 4px">
        <span class="n">${t.k}</span>
        <div style="min-width:0">${wait ? `<div style="height:44px;border-radius:5px;background:#0f0f13;display:grid;place-items:center;color:var(--t4);font-size:11.5px">waiting</div>` : `<div style="display:flex;flex-direction:column;gap:2px">${miniTake(bassN.length ? bassN : [{ s:0, l:0, p:40 }], 29, 36, C.violet, on, lw, 21)}${miniTake(padN.length ? padN : [{ s:0, l:0, p:60 }], 29, 36, C.indigo, on, lw, 21)}</div>`}</div>
        <div style="text-align:right">${live ? `<span class="mono blink" style="font-size:11px;color:var(--accent-t)">bar 31</span>` : wait ? '' : `<div class="mono" style="font-size:11px;color:var(--t3)">${t.seed}</div><div class="mono" style="font-size:11px;color:var(--t3)">${t.notes + t.pad.length} notes</div>`}
          ${!wait && !live ? `<div class="row" style="justify-content:flex-end;gap:2px;margin-top:3px"><span class="ib" style="width:24px;height:22px">${I('play', 12)}</span><span class="ib" style="width:24px;height:22px">${I('lock', 12)}</span></div>` : ''}</div>
      </div>`;
    }).join('')}</div>`;
  }
  const foot = state === 'first' ? `<div class="btn primary dis">Write 4 takes</div>`
    : state === 'ready' ? `<div class="btn primary">${I('compose', 13)} Write 4 takes</div>`
    : state === 'writing' ? `<span class="readout" style="white-space:nowrap"><span class="mono">take 2 of 4 · 0:07</span></span><div class="btn">${I('square', 11)} Stop</div>`
    : `<span class="btn ghost">${I('compose', 13)} 4 more</span><div class="btn primary">${I('check', 13)} Keep take 2</div>`;
  return `<div class="editor" style="height:${h}px">
    <div class="ebar"><div class="tname">${I('compose', 15)} Compose <span class="cnt">bars 29–36 · Bass, Pad</span></div>
      <div class="etabs"><button>Piano Roll</button><button>Step Sequencer</button><button class="on">Compose</button></div>
      <div class="grow"></div>${state === 'writing' ? `<div class="prog shim" style="width:120px"><i style="width:43%"></i></div>` : ''}<div class="ib">${I('x', 14)}</div></div>
    <div class="ebody">${what}${how}
      <div style="flex:1;min-width:0;display:flex;flex-direction:column">
        <div class="cap2" style="padding:12px 16px 6px;display:flex;justify-content:space-between"><span>TAKES</span><span style="font-weight:400">${state === 'takes' ? 'each heard in the song: Space' : ''}</span></div>
        ${takes}
        <div class="row" style="justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)">${foot}</div>
      </div>
    </div>
  </div>`;
}

// ---------- Design 3: a page of its own. ----------
function d3(state, narrow) {
  const W = narrow ? 1000 : 1440, H = narrow ? 800 : 900;
  const sideW = narrow ? 268 : 300, rowHeadW = narrow ? 168 : 210;
  const gridW = W - sideW - rowHeadW;
  const b0 = narrow ? 17 : 1, b1 = 44;
  const bw = gridW / (b1 - b0 + 1);
  const drums = lanePlan('drums').flatMap(r => r.notes);
  const rows = [
    { id:'kick', name:'Kick', col:C.coral, part:'Drums', notes:drums.filter(n => n.p === 36), lo:30, hi:44, hit:true },
    { id:'snare', name:'Snare', col:C.coral, part:'Drums', notes:drums.filter(n => n.p === 38), lo:30, hi:44, hit:true },
    { id:'hats', name:'Hats', col:C.red, part:'Drums', notes:drums.filter(n => n.p === 42), lo:30, hi:44, hit:true },
    { id:'808', name:'808', col:C.violet, part:'Bass', notes:bassBarsRange(21, 28, -12), lo:18, hi:40 },
    { id:'bass', name:'Bass', col:C.violet, part:'Bass', write:true, notes:bassBarsRange(3, 28), lo:30, hi:50 },
    { id:'keys', name:'Keys', col:C.mint, audio:true },
    { id:'stabs', name:'Stabs', col:C.teal, part:'Keys', notes:stabNotes(21, 44), lo:56, hi:66 },
    { id:'pad', name:'Pad', col:C.indigo, part:'Pad', write:true, notes:padBars(1, 2).concat(padBars(21, 28)), lo:56, hi:72 },
  ];
  const sel = [29, 36], win = [21, 36];
  const rowH = narrow ? 44 : 52;
  const laneH = Math.min(110, Math.floor((H - 52 - 24 - 36 - 48 - 22 - rows.length * rowH - 36) / 2));
  const doneTo = state === 'writing' ? 32 : state === 'takes' ? 37 : 0;
  const take = TAKES[1];
  const cells = r => {
    let s = `<svg width="${gridW}" height="${rowH}"><rect width="${gridW}" height="${rowH}" fill="${C.lane}"/>`;
    if (state === 'writing') s += `<rect x="${(win[0] - b0) * bw}" y="0" width="${(win[1] - win[0] + 1) * bw}" height="${rowH}" fill="#fff" fill-opacity=".025"/>`;
    for (let b = b0; b <= b1; b++) s += `<line x1="${(b - b0) * bw}" x2="${(b - b0) * bw}" y1="0" y2="${rowH}" stroke="${(b - 1) % 4 ? C.soft : C.line}"/>`;
    const ny = (n, lo, hi) => 6 + (1 - (n.p - lo) / Math.max(1, hi - lo)) * (rowH - 14);
    if (r.audio) { s += `<rect x="1" y="4" width="${gridW - 2}" height="${rowH - 8}" rx="4" fill="${r.col}" fill-opacity=".07"/>`; const R = rng(9); for (let x = 3; x < gridW - 3; x += 2) { const a = (.2 + R() * .55) * (rowH - 14) / 2; s += `<rect x="${x}" y="${rowH / 2 - a}" width="1" height="${a * 2}" fill="${r.col}" fill-opacity=".35"/>`; } return s + '</svg>'; }
    // Bars it plays: a soft cell, its notes in it.
    const bars = new Set(r.notes.map(n => Math.floor(n.s)));
    bars.forEach(b => { if (b < b0 || b > b1 || (r.write && b >= sel[0] && b <= sel[1])) return; s += `<rect x="${(b - b0) * bw + 1.5}" y="3" width="${bw - 3}" height="${rowH - 6}" rx="3" fill="${r.col}" fill-opacity=".1"/>`; });
    r.notes.forEach(n => {
      if (n.s < b0 || n.s >= b1 + 1) return;
      const x = (n.s - b0) * bw + 2;
      if (r.hit) s += `<rect x="${x}" y="${rowH / 2 - (r.id === 'hats' ? 3 : 6)}" width="1.4" height="${r.id === 'hats' ? 6 : 12}" rx=".7" fill="${r.col}" fill-opacity="${r.id === 'hats' ? .55 : .9}"/>`;
      else s += `<rect x="${x}" y="${ny(n, r.lo, r.hi)}" width="${Math.max(1.5, n.l * bw - 1)}" height="2" rx="1" fill="${r.col}"/>`;
    });
    if (r.write) for (let b = sel[0]; b <= sel[1]; b++) {
      if (b < b0) continue;
      const x = (b - b0) * bw, done = b < doneTo, cur = state === 'writing' && b === doneTo;
      s += `<rect x="${x + 1.5}" y="3" width="${bw - 3}" height="${rowH - 6}" rx="3" fill="${done ? r.col : C.accent}" fill-opacity="${done ? .1 : .1}" stroke="${done ? r.col : C.accent}" stroke-opacity="${done ? .5 : cur ? 1 : .6}" ${done ? '' : 'stroke-dasharray="3 2"'}/>`;
      if (done || cur) (r.id === 'bass' ? take.bass : take.pad).filter(n => n.s >= b && n.s < b + (cur ? .4 : 1)).forEach(n => s += `<rect x="${(n.s - b0) * bw + 2}" y="${ny(n, r.lo, r.hi)}" width="${Math.max(1.5, n.l * bw - 1)}" height="2" rx="1" fill="${r.col}"/>`);
      if (cur) s += `<rect x="${x + 1.5}" y="3" width="${bw - 3}" height="${rowH - 6}" rx="3" fill="${C.accent}" fill-opacity=".16" class="blink"/>`;
    }
    return s + '</svg>';
  };
  const gridHead = `<div style="display:flex;height:48px;border-bottom:1px solid var(--line);background:var(--surface)"><div style="width:${rowHeadW}px;flex:none;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px"><div class="seg"><button class="on" title="Paint bars to write">${I('pencil', 13)}</button><button>${I('eraser', 13)}</button></div>${narrow ? '' : '<span class="lbl" style="font-size:11.5px">paint bars</span>'}</div>${ruler(gridW, b0, b1, null)}</div>`;
  // What the model hears as it writes: its window, moving a step at a time.
  const wx = (win[0] - b0) * bw, ww = (win[1] - win[0] + 1) * bw, on = state === 'writing';
  const winStrip = `<div style="display:flex;height:22px;border-bottom:1px solid var(--line);background:var(--surface)"><div style="width:${rowHeadW}px;flex:none;border-right:1px solid var(--line);font-size:11px;color:var(--t3);display:flex;align-items:center;padding-left:10px">Model hears</div><svg width="${gridW}" height="22">${state === 'takes' ? '' : `<path d="M${wx + 1} 16 V7 H${wx + ww - 1} V16" fill="none" stroke="${on ? C.t2 : C.t4}" stroke-width="1.2"/><rect x="${wx + ww / 2 - 92}" y="1" width="184" height="16" fill="#131317"/><text x="${wx + ww / 2}" y="13" text-anchor="middle" font-family="Geist Mono" font-size="10.5" fill="${on ? C.t1 : C.t3}">${on ? 'bars 21–36 · step 4 of 8' : 'bars 21–36, 16 at a time'}</text>`}</svg></div>`;
  const rowsHtml = rows.map(r => `<div style="display:flex"><div class="rhead" style="width:${rowHeadW}px;height:${rowH}px;${r.write ? 'background:var(--header-sel)' : ''}"><span class="bar" style="background:${r.col};opacity:${r.write ? 1 : .35}"></span>
      <span style="font-weight:${r.write ? 600 : 500};font-size:12.5px;flex:1;white-space:nowrap">${r.name}</span>
      ${r.audio ? `<span class="lbl" style="font-size:11px">audio · not heard</span>` : `<span class="part">${r.part} ${I('chev')}</span><span class="eye">${I('eye')}</span>`}
    </div>${cells(r)}</div>`).join('');
  // Bar by bar: the steering for the track picked (Prism takes it per bar).
  const barLane = (label, vals, col) => {
    let s = `<svg width="${gridW}" height="${laneH}"><rect width="${gridW}" height="${laneH}" fill="${C.lane}"/>`;
    for (let b = b0; b <= b1; b++) {
      const x = (b - b0) * bw;
      s += `<line x1="${x}" x2="${x}" y1="0" y2="${laneH}" stroke="${(b - 1) % 4 ? C.soft : C.line}"/>`;
      const v = vals[b];
      if (v != null) { const hh = (laneH - 16) * (v + 1) / 10; s += `<rect x="${x + 3}" y="${laneH - 4 - hh}" width="${bw - 6}" height="${hh}" rx="2" fill="${col}" fill-opacity=".45"/><rect x="${x + 3}" y="${laneH - 4 - hh}" width="${bw - 6}" height="2" rx="1" fill="${col}"/>`; if (bw > 18) s += `<text x="${x + bw / 2}" y="${laneH - 7 - hh}" text-anchor="middle" font-family="Geist Mono" font-size="9.5" fill="${C.t2}">${v + 1}</text>`; }
      else if (b >= sel[0] && b <= sel[1]) s += `<rect x="${x + 3}" y="${laneH - 6}" width="${bw - 6}" height="2" rx="1" fill="${C.t4}"/>`;
    }
    return `<div style="display:flex;border-top:1px solid var(--soft)"><div class="rhead" style="width:${rowHeadW}px;height:${laneH}px;border:0;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px"><span style="font-size:12px;font-weight:500">${label}</span><span class="lbl" style="font-size:11px">Bass · a level per bar</span></div>${s}</svg></div>`;
  };
  const poly = {}; [29, 30, 31, 32, 33, 34, 35, 36].forEach((b, i) => poly[b] = [0, 0, 1, 0, 0, 0, 1, 2][i]);
  const len = {}; [29, 30, 31, 32].forEach((b, i) => len[b] = [3, 4, 4, 6][i]);
  const side = d3side(state, narrow, sideW);
  return `${cbar(narrow, 'compose')}
  <div class="body">
    <div class="cgrid">
      <div class="ctab"><button class="on">Song</button><button>Takes · ${state === 'takes' ? 4 : 0}</button><div class="grow"></div><span class="lbl" style="font-size:11.5px;padding-bottom:9px">${narrow ? 'Paint the bars to write' : 'Paint the bars to write · the eye hides a part from the model'}</span></div>
      ${gridHead}${winStrip}${rowsHtml}
      <div style="flex:1;background:var(--lane);border-top:1px solid var(--line);display:flex;flex-direction:column">
        <div class="ctab" style="height:32px;background:var(--surface)"><button class="on">Steering</button><button>Notes at once</button><button>Note length</button>${narrow ? '' : '<button>Pitch range</button><button>Silence</button>'}<div class="grow"></div><span class="lbl" style="font-size:11.5px;padding-bottom:8px">${narrow ? 'blank: model’s choice' : 'draw a level per bar · blank is the model’s choice'}</span></div>
        ${barLane('Notes at once', poly, C.violet)}${barLane('Note length', len, C.violet)}<div style="flex:1;display:flex"><div style="width:${rowHeadW}px;border-right:1px solid var(--line);background:var(--headers)"></div></div>
      </div>
    </div>
    ${side}
  </div>
  ${status(state === 'writing' ? 'MIDI-GPT Prism Medium writes a bar at a time, hearing 16: bars 21–36 now' : 'Corner Store Blues · 44 bars · 2 parts painted, 16 bars to write', state === 'first' ? 'Downloading Prism Medium 41%' : state === 'writing' ? 'MIDI-GPT · step 4 of 8' : '')}`;
}
function d3side(state, narrow, w) {
  const name = 'MIDI-GPT Prism Medium';

  const info = `<div class="rows" style="font-size:12px">${[['Writes', 'Bass, Pad · bars 29–36'], ['Hears', 'Drums, 808, Stabs · 21–36'], ['Window', '16 bars · 4096 tokens'], ['Runs on', 'Apple GPU']].map(([a, b]) => `<div class="row" style="justify-content:space-between;padding:5px 0"><span class="lbl">${a}</span><span style="color:var(--t2);text-align:right">${b}</span></div>`).join('')}</div>`;

    foot = `<div class="btn big">${I('square', 12)} Stop</div>`;
  } else {
    body = `${field2(state)}<div class="cap2" style="display:flex;justify-content:space-between"><span>TAKES</span><span style="font-weight:400">Space hears it in the song</span></div>
      <div class="rows">${TAKES.map((t, i) => `<div class="take${i === 1 ? ' sel' : ''}" style="grid-template-columns:22px 1fr auto"><span class="n">${t.k}</span><div style="min-width:0">${miniTake(t.bass, 29, 36, C.violet, i === 1, 200, 16)}${miniTake(t.pad, 29, 36, C.indigo, i === 1, 200, 16)}<div class="meta">seed ${t.seed} · ${t.notes + t.pad.length} notes</div></div><span class="ib" style="width:24px;height:24px">${I('play', 12)}</span></div>`).join('')}</div>
      <span class="btn ghost" style="justify-content:center">${I('compose', 13)} Write 4 more</span>`;

  }
  return `<div style="width:${w}px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column">

        <div class="srow"><div class="tx"><b>MIDI-GPT’s Python</b><small>${state === 'first' ? 'Comes with the first model downloaded' : 'Python 3.12 · midigpt 0.4.2 · 687 MB'}</small></div>${state === 'first' ? '<span class="lbl">Not yet</span>' : '<span class="btn ghost">Reinstall</span>'}</div>
        <div class="srow"><div class="tx"><b>Runs on</b><small>A model loads in a few seconds and stays up between takes; it stops itself after ten idle minutes</small></div><div style="width:190px;flex:none">${field('Auto · Apple GPU')}</div></div>
        <div class="srow"><div class="tx"><b>${state === 'writing' ? 'Yellow Small is running' : 'Nothing running'}</b><small>${state === 'writing' ? 'on this computer only (127.0.0.1:53211) · writing for Corner Store Blues' : 'Started when you write, on this computer only'}</small></div>${state === 'writing' ? '<span class="btn">Stop it</span>' : ''}</div>
        <div class="srow"><div class="tx"><b>Folder</b><small class="mono" style="font-size:11.5px">~/Library/Application Support/Pina Studio/Composers</small></div><span class="btn ghost">${I('folder', 13)} Show</span></div>
      </div>
    </div></div>
  ${status('Settings', state === 'first' ? 'Downloading Yellow Small 41%' : '')}`;
}

// ---------- The review: which design, which state, which width. ----------
const DESIGNS = [['1', '1 · In the roll'], ['2', '2 · Across the song'], ['3', '3 · Composer page'], ['s', 'Settings']];
const STATES = [['first', 'First run'], ['ready', 'Ready'], ['writing', 'Writing'], ['takes', 'Takes']];
const WIDTHS = [['wide', '1440 × 900'], ['narrow', '1000 × 800']];
const ABOUT = {
  '1': [['Where', 'A Compose tab in the piano roll’s side panel, beside Generate and Chords. Drag the bars on the ruler; the take is drawn in the roll itself, dashed, over what’s there.'], ['Best for', 'One part at a time, the way you already write in the roll: fill a gap, try a variation, flip takes with ← → and keep one.'], ['Gives up', 'Writing several parts at once (the model can, but here you’d do them one after the other), and per-bar steering.']],
  '2': [['Where', 'Pick tracks in the headers and drag bars on the ruler, then Compose opens under the song like the editor. Each track picked gets its part; takes write them all together.'], ['Best for', 'MIDI-GPT’s strength: a whole section’s band at once (bass and pad written together, each hearing the other), auditioned in the song.'], ['Gives up', 'Room: the editor’s place is taken while it’s open; controls are per part in a short table, not bar by bar.']],
  '3': [['Where', 'A page of its own, like Song Study: every track a row, every bar a cell. Paint the bars to write, hide parts from the model with the eye, and draw steering per bar under it.'], ['Best for', 'Prism and Expressive’s per-bar controls (notes at once, density, pitch range, silence), seeing the window the model hears move as it writes, longer stretches.'], ['Gives up', 'Being where you edit: you leave the arrangement to use it, and come back to the result.']],
  's': [['Settings › Composers', 'The same whichever design you pick: sign in for the gated models, download them (amber: their licence isn’t open), the Python each family runs in, where it runs and how to stop it.'], ['First run', 'Also shown in place, in each design’s panel (State: First run), so nobody has to come here first.'], ['Licence', 'MIDI-GPT’s weights are non-commercial research only; Pina Studio ships none, and says so before every download.']],
};
let st = { design:'1', state:'takes', width:'wide' };
try { st = { ...st, ...JSON.parse(localStorage.getItem('compose-review') || '{}') }; } catch (e) {}
function opts(id, list, key) {
  document.getElementById(id).innerHTML = list.map(([v, l]) => `<button class="${st[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}">${l}</button>`).join('');
}
function render() {
  opts('o-design', DESIGNS, 'design'); opts('o-state', STATES, 'state'); opts('o-width', WIDTHS, 'width');
  const narrow = st.width === 'narrow';
  const f = { '1':d1, '2':d2, '3':d3, 's':settings }[st.design];
  const frame = document.getElementById('frame');
  frame.innerHTML = `<div class="win${narrow ? ' narrow' : ''}">${f(st.state, narrow)}</div>`;
  const avail = document.querySelector('.stage').clientWidth - 40, w = narrow ? 1000 : 1440, h = narrow ? 800 : 900;
  const k = Math.min(1, avail / w);
  frame.style.transform = `scale(${k})`; frame.style.height = `${h * k}px`; frame.style.width = `${w}px`;
  document.getElementById('about').innerHTML = ABOUT[st.design].map(([a, b]) => `<div><h3>${a}</h3><p>${b}</p></div>`).join('');
  try { localStorage.setItem('compose-review', JSON.stringify(st)); } catch (e) {}
}
document.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { st[b.dataset.k] = b.dataset.v; render(); } });
addEventListener('resize', render);
const q = new URLSearchParams(location.search);
['design', 'state', 'width'].forEach(k => q.get(k) && (st[k] = q.get(k)));
document.fonts.ready.then(render); render();
</script>
