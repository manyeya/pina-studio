# Pina Studio for Windows: for a release tag vX.Y.Z, the app is built, packaged as an installer and
# a zip, put on that tag's release, then tested. Run it by hand (Actions, Windows, Run workflow)
# for a build to try from any branch: its downloads are kept with the run.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # The C runtime is Microsoft's DLLs, beside the app (copied below): ONNX Runtime's library is
      # built against them, and a C runtime linked in can't be linked with it.
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the app and the pina command
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          # "Pina Studio.exe" opens without a console; pina.exe is the command line.
          cargo build --release -p pina --features windows-gui
          Copy-Item target\release\pina.exe "staging\Pina Studio.exe"
          cargo build --release -p pina
          Copy-Item target\release\pina.exe staging\pina.exe
          # ONNX Runtime (stem separation) is linked in, but its DirectML wants the redistributable
          # DirectML.dll beside the app, newer than the one Windows has; the build copies it out.
          $dml = Get-ChildItem target\release -Recurse -Filter DirectML.dll | Select-Object -First 1
          if (-not $dml) { Write-Error "DirectML.dll wasn't copied out by ort's build"; exit 1 }
          Copy-Item $dml.FullName staging\DirectML.dll
          # The C runtime's DLLs (Visual C++'s redistributable, app-local), so the app runs on a PC
          # without Visual C++'s installed.
          # Wherever Visual Studio is (vswhere knows; its version changes with the runner image).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT\*.dll" |
            Sort-Object FullName -Descending
          if (-not ($crt | Where-Object Name -eq 'vcruntime140.dll')) { Write-Error "Visual C++'s runtime DLLs weren't found"; exit 1 }
          $crt | Group-Object Name | ForEach-Object { Copy-Item $_.Group[0].FullName staging\ }
          Get-ChildItem staging

      - name: Make the installer
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'pina').version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$version" "/DSource=$PWD\staging" scripts\windows\pina.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path staging\* -DestinationPath "dist\PinaStudio-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PinaStudio-windows-x64
          path: dist/*

      - name: Put it on the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Test
        run: cargo test -p pina-engine -p pina
