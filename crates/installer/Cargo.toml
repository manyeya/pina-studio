[package]
name = "tempo-installer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tempo-installer"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders", "font-kit"] }
# The old tempo goes to the Trash as the Finder sends things there.
objc2-foundation = "0.3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
# The `shots` test: the installer's screens drawn to PNGs, no window shown.
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["runtime_shaders", "font-kit", "test-support"] }
