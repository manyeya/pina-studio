[package]
name = "pina-engine"
version.workspace = true
edition.workspace = true

[dependencies]
cpal = "0.18"
vst3 = "0.3"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
# MP3 bounces: LAME, built from its source.
mp3lame-encoder = "0.2.5"
midir = "0.11"
rubberband = "0.1.5"
clap-sys = "0.5"
symphonia = { version = "0.6.1", default-features = false, features = ["aiff", "flac", "mp3", "wav", "pcm", "adpcm", "opt-simd"] }
rustfft = "6.4"
# Spectrogram pictures, read for a reference (the app already builds it, through its UI).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# macOS: plugin bundles and editor windows, Audio Units.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "AUComponent", "AudioComponent", "AudioUnitProperties", "AudioUnitUtilities", "MusicDevice", "block2", "objc2-core-audio-types", "objc2-core-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes", "objc2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFPropertyList", "CFString", "CFURL"] }
block2 = "0.6"

# Stems: separation models the person brings run in ONNX Runtime, linked in where its builds
# exist (Apple silicon, with Core ML; Windows x64, with DirectML). Intel Macs build without it.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31", "coreml"] }
# Lyrics: Whisper, by whisper.cpp (built with cmake), on the GPU through Metal.
whisper-rs = { version = "=0.16.0", features = ["metal"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31", "directml"] }
whisper-rs = "=0.16.0"

# Windows: plugin DLLs and editor windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The stretch Pina Studio used before Rubber Band, for examples/stretch_ab to compare with.
signalsmith-stretch = "0.1"
