[package]
name = "tempo-engine"
version.workspace = true
edition.workspace = true

[dependencies]
cpal = "0.18"
vst3 = "0.3"
rtrb = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "AUComponent", "AudioComponent", "AudioUnitProperties", "AudioUnitUtilities", "MusicDevice", "block2", "objc2-core-audio-types", "objc2-core-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes", "objc2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFPropertyList", "CFString", "CFURL"] }
block2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
midir = "0.11"
signalsmith-stretch = "0.1"
