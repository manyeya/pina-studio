[package]
name = "pina"
version.workspace = true
edition.workspace = true

[dependencies]
pina-engine = { path = "../engine" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
# gpui-pre: a weekly crates.io republish of gpui, since gpui's own release is stale and its
# git repo can't be a dependency. 0.3.9 is upstream 93d7456 plus labeled packaging edits, checked with
# scripts/check-gpui-pre.py; rerun it when bumping.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# runtime_shaders: compile Metal shaders at launch, so building doesn't need full Xcode. font-kit: text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders", "font-kit"] }
# Songs go to the Trash as the Finder sends them (any volume, no special access).
objc2-foundation = "0.3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
# The `shots` test: pages drawn to PNGs by the headless Metal renderer, no window shown.
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["runtime_shaders", "font-kit", "test-support"] }
# examples/icon: the app icon's SVG to PNGs (gpui draws SVGs with it too).
resvg = "0.46"
